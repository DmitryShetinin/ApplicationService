version: "3.9"

services:

  postgres:
    image: postgres:17
    container_name: employee-postgres

    environment:
      POSTGRES_DB: employee_requests
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
 

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d employee_requests"]
      interval: 5s
      timeout: 5s
      retries: 10

  applicationservice:
    image: applicationservice

    build:
      context: .
      dockerfile: Dockerfile

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      ASPNETCORE_ENVIRONMENT: Production

      ConnectionStrings__Default: Host=postgres;Port=5432;Database=employee_requests;Username=postgres;Password=postgres

    ports:
      - "5353:5353"

    restart: unless-stopped

volumes:
  postgres_data: